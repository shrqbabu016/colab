name: Colab Auto Restarter

on:
  schedule:
    # Runs at minute 0 of every hour (e.g. 1:00, 2:00, 3:00, ...)
    - cron: '0 * * * *'
  # Allows manual execution anytime via GitHub Actions "Run workflow" button
  workflow_dispatch:

jobs:
  restart-colab:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Puppeteer Colab Restarter
        env:
          COLAB_URL: ${{ secrets.COLAB_URL }}
          COLAB_COOKIES: ${{ secrets.COLAB_COOKIES }}
          # Set to 'true' if you want it to automatically run all cells after restarting
          RUN_AFTER_RESTART: 'true'
        run: node index.js

      - name: Upload Debug Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colab-screenshots
          path: '*.png'
          if-no-files-found: ignore
